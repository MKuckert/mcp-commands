name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "stable"

      - name: Vet
        run: go vet ./...

      # The full suite is Unix-oriented (exec bits, shebang execution).
      # On Windows it compiles the whole module's test files and runs only
      # the native .exe discovery/invocation smoke test (windows_test.go)
      # — the OS-aware discovery predicate and the real exec path against
      # a genuine PE binary.
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: go test ./...

      - name: Test (Windows smoke)
        if: matrix.os == 'windows-latest'
        run: go test ./... -run TestWindowsExeSmoke -v

      # shellcheck and zsh are preinstalled on ubuntu-latest; fish is not.
      - name: Lint shell completion scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck completion/mcp-commands.bash
          zsh -n completion/mcp-commands.zsh
          sudo apt-get update
          sudo apt-get install -y fish
          fish -n completion/mcp-commands.fish

      # Fail the build if a completion script's flag block diverges from the
      # binary's actual flag set ("forgot to update completions" = red CI).
      - name: Check completion flag drift
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          go build -o dist/mcp-commands .
          help_flags=$(dist/mcp-commands --help | awk '/^  -/{print $1}' | sed 's/^-//' | sort)
          normalize() {
            tr ' ' '\n' | sed 's/^--*//' | grep -v '^$' | sort -u
          }
          drift() {
            # $1 = script path, $2 = its flag set
            if [ "$help_flags" != "$2" ]; then
              echo "flag drift in $1 (binary vs completion script):" >&2
              diff <(printf '%s\n' "$help_flags") <(printf '%s\n' "$2") >&2 || true
              exit 1
            fi
            echo "$1: flag set matches mcp-commands --help"
          }
          drift completion/mcp-commands.bash  "$(grep -E '^flags="' completion/mcp-commands.bash  | sed -e 's/^flags="//' -e 's/"$//' | normalize)"
          drift completion/mcp-commands.zsh   "$(grep -E '^flags=\(' completion/mcp-commands.zsh | sed -e 's/^flags=( //' -e 's/ )$//' | normalize)"
          drift completion/mcp-commands.fish  "$(grep -E '^set -l flags ' completion/mcp-commands.fish | sed 's/^set -l flags //' | normalize)"
