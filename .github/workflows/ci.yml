name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "stable"

      - name: Vet
        run: go vet ./...

      # The full suite is Unix-oriented (exec bits, shebang execution).
      # On Windows it compiles the whole module's test files and runs only
      # the native .exe discovery/invocation smoke test (windows_test.go)
      # — the OS-aware discovery predicate and the real exec path against
      # a genuine PE binary.
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -coverprofile=coverage.out

      - name: Coverage report and gate
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          go tool cover -func=coverage.out
          go tool cover -html=coverage.out -o coverage.html
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          # prod.go is the documented, structurally-uncoverable remainder
          # (real TTY, os.Exit); the gate measures the rest of the package.
          excl=$(awk -F' ' '/^mode:/{next} {split($1, r, ":"); f = r[1]; sub(/.*\//, "", f); if (f == "prod.go") next; s += $2; if ($3 > 0) c += $2} END {printf "%.1f", 100 * c / s}' coverage.out)
          echo "coverage: ${total}% total, ${excl}% excluding prod.go (gate: 95%)"
          awk -v c="$excl" 'BEGIN { exit (c < 95) }'

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: warn

      - name: Test (Windows smoke)
        if: matrix.os == 'windows-latest'
        run: go test ./... -run TestWindowsExeSmoke -v

      # The ubuntu runner image does not ship zsh (and fish); install the
      # linters explicitly so the step does not depend on image contents.
      - name: Lint shell completion scripts
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fish shellcheck zsh
          shellcheck completion/mcp-commands.bash
          zsh -n completion/mcp-commands.zsh
          fish -n completion/mcp-commands.fish

      # Fail the build if a completion script's flag block diverges from the
      # binary's actual flag set ("forgot to update completions" = red CI).
      - name: Check completion flag drift
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          go build -o dist/mcp-commands .
          help_flags=$(dist/mcp-commands --help | awk '/^  -/{print $1}' | sed 's/^-//' | sort)
          # The flag package accepts --help/-h even though PrintDefaults never
          # lists it; the scripts complete it, so count it in the binary set.
          help_flags=$(printf 'help\n%s\n' "$help_flags" | sort -u)
          normalize() {
            tr ' ' '\n' | sed 's/^--*//' | grep -v '^$' | sort -u
          }
          drift() {
            # $1 = script path, $2 = its flag set
            if [ "$help_flags" != "$2" ]; then
              echo "flag drift in $1 (binary vs completion script):" >&2
              diff <(printf '%s\n' "$help_flags") <(printf '%s\n' "$2") >&2 || true
              exit 1
            fi
            echo "$1: flag set matches mcp-commands --help"
          }
          drift completion/mcp-commands.bash  "$(grep -E '^_mcp_commands_flags="' completion/mcp-commands.bash  | sed -e 's/^_mcp_commands_flags="//' -e 's/"$//' | normalize)"
          drift completion/mcp-commands.zsh   "$(grep -E '^_mcp_commands_flags=\(' completion/mcp-commands.zsh | sed -e 's/^_mcp_commands_flags=( //' -e 's/ )$//' | normalize)"
          drift completion/mcp-commands.fish  "$(grep -E '^set -l _mcp_commands_flags ' completion/mcp-commands.fish | sed 's/^set -l _mcp_commands_flags //' | normalize)"
