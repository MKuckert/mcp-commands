# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    # Tag-derived version: the binary reports the release tag, never the
    # hardcoded development constant in main.go.
    ldflags:
      - -X main.serverVersion={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    # Use zip for Windows archives automatically
    format_overrides:
      - goos: windows
        format: zip
    wrap_in_directory: false
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # An explicit files list disables GoReleaser's implicit default globs,
    # so re-enumerate them alongside the shell completion scripts.
    files:
      - license*
      - LICENSE*
      - readme*
      - README*
      - changelog*
      - CHANGELOG*
      - completion/mcp-commands.bash
      - completion/mcp-commands.zsh
      - completion/mcp-commands.fish

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
